<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kangkan Sarkar | Electronics & Communication Engineer</title>
    <meta name="description" content="Portfolio of Kangkan Sarkar, an Electronics & Communication Engineering student exploring VLSI, PCB Design, and Embedded Systems." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <meta property="og:title" content="Kangkan Sarkar | Portfolio" />
    <meta property="og:description" content="An aspiring electronics engineer focused on hardware and digital design." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('portfolio-ui-theme');
          var isDark = storedTheme === 'dark' || (!storedTheme); // Default is dark
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark body { background-color: #09090b; color: #f1f5f9; }
      html:not(.dark) body { background-color: #ffffff; color: #0f172a; }
      body { margin: 0; }
    </style>
  </head>
  <body class="antialiased selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
